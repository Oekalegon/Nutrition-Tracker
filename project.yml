name: NutritionTracker
options:
  bundleIdPrefix: com.donwillems
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

# Shared.xcconfig is committed and always present (required — CI and
# fresh clones have no Local.xcconfig); it optionally includes the
# gitignored Config/Local.xcconfig for personal signing overrides (e.g.
# DEVELOPMENT_TEAM) — see Config/Local.xcconfig.example.
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NutritionTracker:
    type: application
    platform: iOS
    sources:
      - path: NutritionTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.donwillems.NutritionTracker
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ENABLE_PREVIEWS: true
  NutritionTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NutritionTrackerTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: NutritionTracker

schemes:
  NutritionTracker:
    build:
      targets:
        NutritionTracker: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NutritionTrackerTests
