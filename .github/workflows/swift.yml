name: Swift

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: macos-26
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select simulator
      id: simulator
      run: |
        # Runner images carry multiple iOS runtimes side by side (e.g. 18.0
        # through 26.x). `.devices` keys aren't guaranteed sorted, so picking
        # blindly can land on an old runtime. Sort descending and take the
        # newest runtime's first iPhone instead.
        UDID=$(xcrun simctl list devices available -j | jq -r '
          .devices
          | to_entries
          | map(select(.key | contains("iOS")))
          | sort_by(.key)
          | reverse
          | map(.value[])
          | map(select(.isAvailable and (.name | startswith("iPhone"))))
          | .[0].udid
        ')
        echo "Selected simulator UDID: $UDID"
        echo "udid=$UDID" >> "$GITHUB_OUTPUT"

    - name: Boot simulator
      run: |
        # `xcodebuild test` booting a cold simulator implicitly races against
        # the simulator's own services actually being ready — observed on this
        # runner as the test host repeatedly crashing during Swift Testing's
        # bootstrapping ("Restarting after unexpected exit, crash, or test
        # timeout" / "Executed 0 tests", several times in a row, regardless of
        # which iOS runtime was selected) before xcodebuild eventually gives
        # up. Boot explicitly and block until fully ready first.
        xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true
        xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b

    - name: Build
      run: xcodebuild -project NutritionTracker.xcodeproj -scheme NutritionTracker -destination "id=${{ steps.simulator.outputs.udid }}" build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    - name: Run tests
      # The test host intermittently crashes during Swift Testing's own
      # bootstrapping on this runner ("Test crashed with signal trap while
      # preparing to run tests" / "operation never finished bootstrapping"),
      # before any actual test code runs — reproduced locally too, where the
      # identical crash resolved itself on Xcode's own automatic retry. A
      # well-documented class of transient Xcode/Simulator CI flakiness, not
      # an app or test bug. Retry the whole step rather than chase it further.
      run: |
        for attempt in 1 2 3; do
          echo "Test attempt $attempt"
          if xcodebuild -project NutritionTracker.xcodeproj -scheme NutritionTracker -destination "id=${{ steps.simulator.outputs.udid }}" -parallel-testing-enabled NO test CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO; then
            exit 0
          fi
          echo "Attempt $attempt failed"
        done
        exit 1
