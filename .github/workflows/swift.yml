name: Swift

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select simulator
      id: simulator
      run: |
        # Runner images carry multiple iOS runtimes side by side (e.g. 18.0
        # through 26.x). `.devices` keys aren't guaranteed sorted, so picking
        # blindly can land on an old runtime — iOS 18.2 was observed to crash
        # during Swift Testing's bootstrapping (a test-runner-launch failure,
        # not a bug in app/test code), hanging CI for the job's full timeout.
        # Sort descending and take the newest runtime's first iPhone instead.
        UDID=$(xcrun simctl list devices available -j | jq -r '
          .devices
          | to_entries
          | map(select(.key | contains("iOS")))
          | sort_by(.key)
          | reverse
          | map(.value[])
          | map(select(.isAvailable and (.name | startswith("iPhone"))))
          | .[0].udid
        ')
        echo "Selected simulator UDID: $UDID"
        echo "udid=$UDID" >> "$GITHUB_OUTPUT"

    - name: Build
      run: xcodebuild -project NutritionTracker.xcodeproj -scheme NutritionTracker -destination "id=${{ steps.simulator.outputs.udid }}" build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    - name: Run tests
      run: xcodebuild -project NutritionTracker.xcodeproj -scheme NutritionTracker -destination "id=${{ steps.simulator.outputs.udid }}" test CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
